# Android: build an installable APK of apps/vectorcraft-android (arm64 phones and tablets) with
# cargo-apk on an Ubuntu runner, which ships the Android SDK and NDK. The APK is signed with a
# debug key (fine for side-loading; a store release needs its own key) and uploaded as an artifact.
name: Android

on:
  push:
    paths: &paths
      - Cargo.toml
      - Cargo.lock
      - "**/Cargo.toml"
      - apps/vectorcraft-android/**
      - .github/workflows/android.yml
  pull_request:
    paths: *paths
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  apk:
    name: APK (arm64-v8a)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: android-apk
      - name: Install cargo-apk
        run: cargo install cargo-apk --locked
      - name: Build the APK
        run: |
          export ANDROID_HOME="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          export ANDROID_NDK_ROOT="$ANDROID_NDK_LATEST_HOME"
          # cargo-apk signs release builds only with a configured key: a throwaway one for
          # side-loading (a store release sets its own through these variables).
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/release.keystore" -alias androiddebugkey \
            -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=VectorCraft side-load,O=VectorCraft"
          export CARGO_APK_RELEASE_KEYSTORE="$RUNNER_TEMP/release.keystore"
          export CARGO_APK_RELEASE_KEYSTORE_PASSWORD=android
          cargo apk build -p vectorcraft-android --release
          mkdir -p dist/android
          find target/release/apk -name '*.apk' -exec cp {} dist/android/ \;
          ls -l dist/android
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vectorcraft-android
          path: dist/android/*.apk
          if-no-files-found: error
          retention-days: 14
